<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MelasGo2</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0b0720">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0720;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--a:#7c5cff;--b:#ff7a45;--c:#3bc9ff;--t:#f4f2ff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--t);background:radial-gradient(1200px 600px at 20% -10%,#2a1a6e,transparent),radial-gradient(900px 500px at 100% 100%,#4a1d5e,transparent),var(--bg);overflow:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.orb{position:fixed;width:340px;height:340px;border-radius:50%;filter:blur(90px);opacity:.35;animation:float 12s ease-in-out infinite;pointer-events:none}
.o1{background:var(--a);top:-80px;left:-80px}.o2{background:var(--b);bottom:-100px;right:-80px;animation-delay:-6s}
@keyframes float{50%{transform:translate(40px,50px) scale(1.15)}}
#splash{position:fixed;inset:0;background:#000;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:out .8s 3.6s forwards}
#splash span{font:400 clamp(44px,12vw,92px)/1.2 'Great Vibes',cursive;color:#fff;text-shadow:0 0 18px rgba(255,215,140,.55);clip-path:inset(0 100% 0 0);animation:write 2.4s .5s cubic-bezier(.6,0,.3,1) forwards}
#splash i{display:block;height:2px;width:0;margin-top:6px;background:linear-gradient(90deg,transparent,#ffd98a,transparent);animation:ln 1.6s 2.5s forwards}
@keyframes write{to{clip-path:inset(0 0 0 0)}}@keyframes ln{to{width:min(70vw,420px)}}
@keyframes out{to{opacity:0;visibility:hidden}}
.screen{position:fixed;inset:0;display:none;flex-direction:column;max-width:640px;margin:auto;padding:16px}
.screen.on{display:flex;animation:in .6s both}
@keyframes in{from{opacity:0;transform:translateY(24px)}}
.glass{background:var(--card);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(14px)}
h1{font-weight:800;letter-spacing:-.5px}
.grad{background:linear-gradient(90deg,var(--c),var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
input,textarea{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:14px;padding:13px 14px;color:var(--t);font:inherit;outline:none;transition:.2s}
input:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(124,92,255,.25)}
button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:13px 18px;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--a),var(--b));transition:.2s;box-shadow:0 8px 24px rgba(124,92,255,.35)}
button:active{transform:scale(.95)}
#login{justify-content:center;align-items:center;text-align:center;gap:14px}
#login .glass{padding:28px;width:100%;display:flex;flex-direction:column;gap:14px;align-items:center}
#login img.logo{width:120px;border-radius:28px;animation:pulse 3s infinite}
@keyframes pulse{50%{box-shadow:0 0 50px rgba(124,92,255,.7)}}
.av{width:96px;height:96px;border-radius:50%;border:2px dashed var(--a);display:grid;place-items:center;overflow:hidden;cursor:pointer;background:rgba(255,255,255,.05);font-size:28px}
.av img{width:100%;height:100%;object-fit:cover}
.top{display:flex;align-items:center;gap:10px;padding:4px 4px 12px}
.top img.l{width:38px;border-radius:10px}.top .me{margin-left:auto;width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--a)}
.tabs{display:flex;gap:6px;padding:5px;margin-bottom:12px}
.tabs button{flex:1;background:none;box-shadow:none;color:#bbb}
.tabs button.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;box-shadow:0 6px 18px rgba(124,92,255,.4)}
.pane{flex:1;overflow-y:auto;display:none;flex-direction:column;gap:10px;padding-bottom:8px}
.pane.on{display:flex}
.card{padding:14px;display:flex;gap:12px;align-items:center;animation:in .5s both;position:relative;overflow:hidden}
.card.top1{border-color:var(--b);box-shadow:0 0 28px rgba(255,122,69,.25)}
.card .info{flex:1;min-width:0}.card b{font-size:17px}.card p{font-size:13px;color:#b9b4d8;margin-top:2px}
.meta{font-size:12px;color:#8e89b8;margin-top:6px;display:flex;align-items:center;gap:6px}
.meta img{width:18px;height:18px;border-radius:50%;object-fit:cover}
.vote{min-width:62px;padding:10px;background:rgba(255,255,255,.08);box-shadow:none;border:1px solid var(--line);font-size:18px;line-height:1.1}
.vote small{display:block;font-size:11px;opacity:.7}
.vote.on{background:linear-gradient(135deg,var(--a),var(--b));border-color:transparent;animation:pop .35s}
@keyframes pop{50%{transform:scale(1.25)}}
.add{padding:14px;display:flex;flex-direction:column;gap:8px}
.add .r{display:flex;gap:8px}
.msg{max-width:80%;padding:10px 13px;border-radius:18px;font-size:15px;animation:in .3s both;word-wrap:break-word}
.msg small{display:block;font-size:11px;opacity:.65;margin-bottom:2px}
.msg.o{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.m{align-self:flex-end;background:linear-gradient(135deg,var(--a),#a14cff);border-bottom-right-radius:4px}
.send{display:flex;gap:8px;margin-top:8px}.send button{padding:0 20px}
.empty{text-align:center;color:#8e89b8;padding:40px 10px}
</style></head><body>
<div class="orb o1"></div><div class="orb o2"></div>
<div id="splash"><span>By Lorenzo Piras</span><i></i></div>

<div class="screen" id="login">
  <img class="logo" src="icon-192.png" alt="">
  <h1 style="font-size:34px" class="grad">MelasGo2</h1>
  <div class="glass">
    <label class="av" id="avb"><span>📷</span><input type="file" id="file" accept="image/*" hidden></label>
    <input id="name" placeholder="Il tuo nome" maxlength="30">
    <button id="enter" style="width:100%">Entra</button>
  </div>
</div>

<div class="screen" id="app">
  <div class="top"><img class="l" src="icon-192.png"><h1 class="grad">MelasGo2</h1><img class="me" id="me"></div>
  <div class="glass tabs"><button class="on" data-t="p">🔥 Sabato sera</button><button data-t="c">💬 Chat <span id="bd"></span></button></div>
  <div class="pane on" id="p">
    <div class="glass add">
      <input id="pt" placeholder="Dove andiamo? (es. Pizzeria da Gino)" maxlength="60">
      <div class="r"><input id="pd" placeholder="Descrizione" maxlength="200"><input id="pc" placeholder="€ a testa" style="max-width:110px" maxlength="20"></div>
      <button id="padd">＋ Proponi</button>
    </div>
    <div id="pl"></div>
  </div>
  <div class="pane" id="c"><div id="cl" style="display:flex;flex-direction:column;gap:8px"></div></div>
  <div class="send" id="cs" style="display:none"><input id="ct" placeholder="Scrivi (costi, orari...)" maxlength="500"><button id="csb">➤</button></div>
</div>

<script>
const $=s=>document.querySelector(s),esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me=null,photo='',S={users:{},places:[],chat:[]},sig='',tab='p',seen=0;
try{me=JSON.parse(localStorage.melas)}catch(e){}
const post=(r,b)=>fetch('/api/'+r,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...b,user:me&&me.id})}).then(x=>x.json());
const show=id=>{document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))};
const av=u=>(S.users[u]||{}).photo||'icon-192.png';
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);photo=c.toDataURL('image/jpeg',.7);$('#avb').innerHTML='<img src="'+photo+'">'+'<input type="file" id="file" hidden>'};im.src=URL.createObjectURL(f)};
$('#enter').onclick=async()=>{const n=$('#name').value.trim();if(!n){$('#name').focus();return}const r=await post('login',{name:n,photo,user:me&&me.id});me={id:r.id,name:n,photo};localStorage.melas=JSON.stringify(me);start()};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));$('#p').classList.toggle('on',tab=='p');$('#c').classList.toggle('on',tab=='c');$('#cs').style.display=tab=='c'?'flex':'none';if(tab=='c'){seen=S.chat.length;$('#bd').textContent='';scrollC()}});
const scrollC=()=>setTimeout(()=>{$('#c').scrollTop=1e6},30);
$('#padd').onclick=async()=>{const t=$('#pt').value.trim();if(!t)return;await post('place',{title:t,desc:$('#pd').value,cost:$('#pc').value});$('#pt').value=$('#pd').value=$('#pc').value='';poll()};
const sendC=async()=>{const t=$('#ct').value.trim();if(!t)return;$('#ct').value='';await post('chat',{text:t});await poll();scrollC()};
$('#csb').onclick=sendC;$('#ct').onkeydown=e=>{if(e.key=='Enter')sendC()};
function vote(id){post('vote',{place:id}).then(poll)}
function render(){
  const ps=[...S.places].sort((a,b)=>b.votes.length-a.votes.length);
  $('#pl').innerHTML=ps.length?ps.map((p,i)=>`<div class="glass card ${i==0&&p.votes.length>1?'top1':''}" style="animation-delay:${i*60}ms;margin-bottom:10px"><div class="info"><b>${i==0&&p.votes.length>1?'👑 ':''}${esc(p.title)}</b>${p.desc?`<p>${esc(p.desc)}</p>`:''}<div class="meta"><img src="${av(p.by)}">${esc((S.users[p.by]||{}).name||'?')}${p.cost?' · 💶 '+esc(p.cost):''}</div></div><button class="vote ${p.votes.includes(me.id)?'on':''}" onclick="vote('${p.id}')">▲ ${p.votes.length}<small>voti</small></button></div>`).join(''):'<div class="empty">Nessuna proposta ancora.<br>Sii il primo! ✨</div>';
  $('#cl').innerHTML=S.chat.map(m=>{const mine=m.user==me.id;return `<div class="msg ${mine?'m':'o'}">${mine?'':`<small>${esc((S.users[m.user]||{}).name||'?')}</small>`}${esc(m.text)}</div>`}).join('');
  if(tab=='c'){const nb=S.chat.length;if(nb!=seen){seen=nb;scrollC()}}else{const n=S.chat.length-seen;$('#bd').textContent=n>0?'('+n+')':''}
}
async function poll(){try{const s=await (await fetch('/api/state')).json();const g=JSON.stringify(s);if(g!==sig){sig=g;S=s;render()}}catch(e){}}
function start(){show('app');$('#me').src=me.photo||'icon-192.png';poll();setInterval(poll,2500)}
setTimeout(()=>{me?start():show('login')},3600);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
