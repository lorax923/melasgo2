<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MelasGo2</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#07051a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07051a;--a:#7c5cff;--b:#ff7a45;--c:#3bc9ff;--t:#f4f2ff;--m:#9a95c4;--g:rgba(255,255,255,.06);--l:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;overscroll-behavior:none}
body{font:15px/1.35 Inter,system-ui,sans-serif;color:var(--t);background:var(--bg);overflow:hidden;user-select:none;-webkit-user-select:none}
.bgfx{position:fixed;inset:0;z-index:-2;background:radial-gradient(700px 400px at 10% -5%,#2b1b72,transparent),radial-gradient(600px 420px at 100% 100%,#55205f,transparent)}
.bgfx::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:36px 36px;-webkit-mask-image:radial-gradient(circle at 50% 30%,#000,transparent 75%);mask-image:radial-gradient(circle at 50% 30%,#000,transparent 75%);animation:gr 8s linear infinite}
@keyframes gr{to{background-position:0 36px}}
.orb{position:fixed;width:260px;height:260px;border-radius:50%;filter:blur(70px);opacity:.3;animation:fl 14s ease-in-out infinite;z-index:-1;pointer-events:none}
@keyframes fl{50%{transform:translate(40px,50px) scale(1.2)}}
#splash{position:fixed;inset:0;z-index:99;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:.8s}
#splash.go{opacity:0;transform:scale(1.15);visibility:hidden;pointer-events:none}
#cv{position:absolute;inset:0}
.ring{position:absolute;width:min(80vw,380px);aspect-ratio:1;border-radius:50%;background:conic-gradient(transparent,#7c5cff,#3bc9ff,transparent 40%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));animation:rot 3s linear infinite;opacity:.7}
@keyframes rot{to{transform:rotate(360deg)}}
#sn{position:relative;font:800 clamp(40px,13vw,72px)/1 Inter,sans-serif;letter-spacing:-1px;background:linear-gradient(105deg,transparent 42%,#fff 50%,transparent 58%) no-repeat,linear-gradient(90deg,#3bc9ff,#7c5cff,#ff7a45);background-size:300% 100%,100% 100%;background-position:150% 0,0 0;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise 1s .3s both,sweep 1.8s 1.2s linear both}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.9);filter:blur(10px)}}
@keyframes sweep{to{background-position:-50% 0,0 0}}
#sp{position:relative;font:400 clamp(26px,8vw,38px) 'Great Vibes',cursive;color:#ffd98a;text-shadow:0 0 16px rgba(255,200,120,.5);opacity:0;letter-spacing:.2em;animation:tag 1.6s 3s forwards}
@keyframes tag{to{opacity:1;letter-spacing:.04em}}
.bar{position:absolute;bottom:9vh;width:min(60vw,260px);height:2px;background:rgba(255,255,255,.12);overflow:hidden;border-radius:2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--a),var(--b));transform:translateX(-100%);animation:ld 4.4s .3s linear forwards}
@keyframes ld{to{transform:none}}
.screen{position:fixed;inset:0;display:none;flex-direction:column;max-width:560px;margin:auto}
.screen.on{display:flex;animation:in .6s both}
@keyframes in{from{opacity:0;transform:translateY(20px)}}
.glass{background:var(--g);border:1px solid var(--l);border-radius:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.grad{background:linear-gradient(90deg,var(--c),var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;letter-spacing:-.5px}
button{font:inherit;font-weight:600;color:#fff;border:0;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,opacity .2s}
button:active{transform:scale(.94)}button:disabled{opacity:.5}
.pri{background:linear-gradient(135deg,var(--a),var(--b));border-radius:14px;padding:0 18px;min-height:48px;box-shadow:0 8px 22px rgba(124,92,255,.35)}
.sec{background:rgba(255,255,255,.08);border:1px solid var(--l);border-radius:14px;min-height:48px;padding:0 10px}
.wide{width:100%}
input{width:100%;font:inherit;font-size:16px;color:var(--t);background:rgba(255,255,255,.07);border:1px solid var(--l);border-radius:14px;padding:0 14px;min-height:48px;outline:none;transition:.2s;user-select:text;-webkit-user-select:text}
input:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(124,92,255,.25)}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rp .6s ease-out;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
#login{justify-content:center;align-items:center;text-align:center;gap:10px;padding:20px}
.logo{width:104px;border-radius:26px;animation:pu 3s infinite}
@keyframes pu{50%{box-shadow:0 0 50px rgba(124,92,255,.7)}}
#login h2{font-size:32px}.sub{color:var(--m)}
.box{width:100%;padding:22px;display:grid;gap:12px;justify-items:center;margin-top:8px}
.pick{width:96px;height:96px;border-radius:50%;border:2px dashed var(--a);display:grid;place-items:center;overflow:hidden;font-size:28px;cursor:pointer}
.pick img{width:100%;height:100%;object-fit:cover}
.shake{animation:sk .4s}@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#le{color:#ff8fa3;font-size:13px}
header{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 8px}
header h2{font-size:21px}.hl{width:34px;border-radius:9px}.sp{flex:1}
.ib{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--l);font-size:16px;padding:0}
#meb{border:2px solid var(--a)}
main{flex:1;position:relative;overflow:hidden}
.pane{position:absolute;inset:0;overflow-y:auto;padding:6px 14px 18px;opacity:0;visibility:hidden;transform:translateX(26px);transition:.4s cubic-bezier(.2,.9,.3,1);-webkit-overflow-scrolling:touch}
.pane.on{opacity:1;visibility:visible;transform:none}
#fm{max-height:0;overflow:hidden;transition:.45s}#fm.open{max-height:300px}
.fi{padding:12px;display:grid;gap:8px;margin-top:10px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none;color:#fff}
.av img{width:100%;height:100%;object-fit:cover}
.xs{width:22px;height:22px;font-size:11px}.xxs{width:20px;height:20px;font-size:10px;margin-left:-6px;border:2px solid #16103a}
.sm{width:100%;height:100%}.md{width:48px;height:48px}.xl{width:140px;height:140px;font-size:56px}
.card{margin-top:10px;padding:14px;display:flex;gap:12px;justify-content:space-between;transition:.35s;max-height:320px}
.card.new{animation:in .5s both}
.card.out{opacity:0;transform:translateX(60px);max-height:0;padding:0 14px;margin:0;border-width:0;overflow:hidden}
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spin{to{--ang:360deg}}
.card.top{border:1.5px solid transparent;background:linear-gradient(#16103a,#16103a) padding-box,conic-gradient(from var(--ang),#ff7a45,#7c5cff,#3bc9ff,#ff7a45) border-box;animation:spin 4s linear infinite}
.cb{min-width:0;flex:1}.cb b{font-size:17px}.cb p{font-size:13px;color:var(--m);margin-top:2px}
.meta{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--m);flex-wrap:wrap}
.chip{background:rgba(255,255,255,.08);padding:2px 8px;border-radius:10px}
.voters{display:flex;margin:8px 0 0 6px}
.act{display:flex;flex-direction:column;gap:8px;align-items:center}
.vote{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid var(--l);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.vote em{font-style:normal;font-size:17px}
.vote.on{background:linear-gradient(135deg,var(--a),var(--b));border-color:transparent;animation:pop2 .4s}
@keyframes pop2{50%{transform:scale(1.25)}}
.del{width:56px;height:34px;border-radius:12px;background:rgba(255,80,100,.15);font-size:13px;padding:0}.del.arm{background:#e5384f}
.empty{text-align:center;color:var(--m);padding:40px 10px}
.bp{position:fixed;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:80;animation:bp .7s ease-out forwards}
@keyframes bp{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
#c{display:flex;flex-direction:column;padding:0}
.msgs{flex:1;overflow-y:auto;padding:8px 14px}
.m{display:flex;gap:8px;margin:6px 0;align-items:flex-end}.m.mi{flex-direction:row-reverse}
.bb{max-width:78%;padding:9px 12px;border-radius:18px;word-break:break-word}
.ot .bb{background:var(--g);border:1px solid var(--l);border-bottom-left-radius:5px}
.mi .bb{background:linear-gradient(135deg,var(--a),#a14cff);border-bottom-right-radius:5px}
.bb small{display:block;font-size:11px;color:var(--c);font-weight:600}
.bb span{user-select:text;-webkit-user-select:text}
.bb time{display:block;font-size:10px;opacity:.55;text-align:right;margin-top:2px}
.pop{animation:mp .35s cubic-bezier(.2,1.4,.4,1) both}@keyframes mp{from{opacity:0;transform:translateY(14px) scale(.9)}}
#ty{height:0;overflow:hidden;opacity:0;padding:0 16px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--m);transition:.3s}
#ty.on{height:28px;opacity:1}
.dots{display:flex;gap:4px;background:var(--g);padding:6px 9px;border-radius:12px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c);animation:db 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes db{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-6px);opacity:1}}
.cin{display:flex;gap:8px;padding:6px 14px 10px}.cin .pri{width:52px;padding:0}
.inv{padding:16px;display:grid;gap:10px;margin-top:6px}.inv p{color:var(--m);font-size:13px;word-break:break-all}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#cnt{margin:14px 4px 0;color:var(--m);font-size:13px}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;margin-top:8px;cursor:pointer}
.row.new{animation:in .5s both}.row em{font-style:normal;color:var(--m);font-weight:400}
.row small,.cen small{color:var(--m)}small.on{color:#22c55e}
.aw{position:relative}
.dot{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;background:#22c55e;border:2px solid #120d33;animation:pl 2s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}100%{box-shadow:0 0 0 8px rgba(34,197,94,0)}}
nav{position:relative;display:flex;margin:0 12px calc(10px + env(safe-area-inset-bottom));padding:6px;border-radius:22px;background:rgba(255,255,255,.07);border:1px solid var(--l);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
nav button{flex:1;background:none;padding:6px 0;min-height:52px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--m);z-index:1}
nav button.on{color:#fff}nav button span{font-size:20px;position:relative}nav small{font-size:11px}
#ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/3);border-radius:16px;background:linear-gradient(135deg,rgba(124,92,255,.55),rgba(255,122,69,.45));transition:transform .45s cubic-bezier(.3,1.2,.4,1)}
nav b{position:absolute;top:-5px;right:-11px;min-width:16px;height:16px;border-radius:8px;font-size:10px;display:none;place-items:center;padding:0 4px}
#b1{background:#ff3d71}#b2{background:#22c55e}nav b.on{display:grid;animation:pop2 .4s}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;opacity:0;visibility:hidden;transition:.3s;z-index:50}
#sheet.on{opacity:1;visibility:visible}
.sc{width:100%;max-width:520px;margin:auto auto 0;background:#120d33;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:.45s cubic-bezier(.2,.9,.3,1);display:grid;gap:10px;justify-items:center;text-align:center}
#sheet.on .sc{transform:none}.sc>*{width:100%}.sc .pick,.sc .av{width:96px}.sc .xl{width:140px}.sc .av,.sc .pick{margin:auto}
.hp{color:var(--m);text-align:left}.hp b{color:var(--t)}.cen{display:grid;gap:8px;justify-items:center}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#241a5c;border:1px solid var(--l);padding:10px 16px;border-radius:14px;opacity:0;transition:.3s;z-index:60;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#off{position:fixed;top:0;left:0;right:0;background:#e5384f;text-align:center;font-size:12px;padding:3px;transform:translateY(-100%);transition:.3s;z-index:70}
#off.on{transform:none}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style></head><body>
<div class="bgfx"></div><div class="orb" style="background:#7c5cff;top:-90px;left:-90px"></div><div class="orb" style="background:#ff7a45;bottom:-110px;right:-90px;animation-delay:-7s"></div>
<div id="off">Connessione assente… riprovo</div>
<div id="splash"><canvas id="cv"></canvas><div class="ring"></div><h1 id="sn">MelasGo2</h1><div id="sp">Powered By Lorenzo Piras</div><div class="bar"><i></i></div></div>

<div class="screen" id="login">
  <img class="logo" src="icon-192.png" alt=""><h2 class="grad">MelasGo2</h2><p class="sub">Decidiamo insieme il sabato sera</p>
  <div class="glass box"><label class="pick" id="lp"><span>📷</span><input type="file" accept="image/*" hidden></label>
  <input id="ln" placeholder="Il tuo nome" maxlength="20" autocomplete="off"><div id="le"></div><button class="pri wide" id="lb">Entra</button></div>
</div>

<div class="screen" id="app">
  <header><img src="icon-192.png" class="hl" alt=""><h2 class="grad">MelasGo2</h2><i class="sp"></i>
    <button class="ib dl" aria-label="Scarica app">⬇</button><button class="ib sh" aria-label="Condividi">🔗</button><button class="ib" id="meb" aria-label="Profilo"></button></header>
  <main>
    <section class="pane on" id="p">
      <button class="pri wide" id="tg">＋ Proponi un posto</button>
      <div id="fm"><div class="glass fi"><input id="pt" placeholder="Dove andiamo?" maxlength="60" autocomplete="off"><input id="pd" placeholder="Descrizione (facoltativa)" maxlength="200" autocomplete="off"><input id="pc" placeholder="Costo a testa (es. 15€)" maxlength="20" autocomplete="off"><button class="pri" id="pa">Aggiungi</button></div></div>
      <div id="pl"></div>
    </section>
    <section class="pane" id="c"><div class="msgs" id="cs"><div id="ml"></div></div>
      <div id="ty"><span class="dots"><i></i><i></i><i></i></span><span id="tyn"></span></div>
      <div class="cin"><input id="ct" placeholder="Scrivi un messaggio…" maxlength="500" autocomplete="off"><button class="pri" id="sb">➤</button></div></section>
    <section class="pane" id="u">
      <div class="glass inv"><b>Invita gli amici</b><p id="lk"></p><div class="two"><button class="pri dl">⬇ Scarica app</button><button class="sec sh">🔗 Condividi</button></div></div>
      <div id="cnt"></div><div id="ul"></div>
    </section>
  </main>
  <nav><i id="ind"></i>
    <button class="on"><span>🔥</span><small>Proposte</small></button>
    <button><span>💬<b id="b1"></b></span><small>Chat</small></button>
    <button><span>👥<b id="b2"></b></span><small>Persone</small></button></nav>
</div>
<div id="sheet"><div class="sc"></div></div><div id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COL=['#7c5cff','#ff7a45','#3bc9ff','#ff4fa3','#34d399','#fbbf24'];
let me=null,S={users:{},typing:[],places:[],max:15,apk:''},after=0,tab=0,lastTyp=0,lastKick=0,unread=0,busy=false,started=false,first=true,sigP='',sigU='',sigH='',shown=new Set(),shownU=new Set(),dp=null,newPhoto,tt;
try{me=JSON.parse(localStorage.melas2)}catch(e){}
const saveMe=()=>localStorage.melas2=JSON.stringify(me);
const api=(r,b)=>fetch('/api/'+r,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(x=>x.json()).catch(()=>({error:'net'}));
const U=id=>S.users[id]||(me&&id==me.id?{n:me.name,v:0,p:false,on:true}:null);
const hue=id=>[...id].reduce((a,c)=>a+c.charCodeAt(0),0)%6;
const av=(id,c='')=>{const u=U(id);if(!u)return`<div class="av ${c}" style="background:#444">?</div>`;return u.p?`<div class="av ${c}"><img src="/api/photo?u=${id}&v=${u.v}" alt=""></div>`:`<div class="av ${c}" style="background:${COL[hue(id)]}">${esc(u.n.charAt(0).toUpperCase())}</div>`};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)};
const openSheet=h=>{$('.sc').innerHTML=h;$('#sheet').classList.add('on')},closeSheet=()=>$('#sheet').classList.remove('on');
$('#sheet').onclick=e=>{if(e.target.id=='sheet')closeSheet()};
const show=id=>$$('.screen').forEach(s=>s.classList.toggle('on',s.id==id));

/* splash con scintille */
(()=>{const cv=$('#cv'),x=cv.getContext('2d');let W,H,P=[];const fit=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};fit();const t0=performance.now();
function fr(now){const t=(now-t0)/1000;x.clearRect(0,0,W,H);const r=$('#sn')&&$('#sn').getBoundingClientRect();
if(r&&t>1.2&&t<3){const px=r.left+r.width*((t-1.2)/1.8);for(let i=0;i<5;i++)P.push({x:px+(Math.random()-.5)*16,y:r.top+r.height*(.15+Math.random()*.75),vx:(Math.random()-.5)*70,vy:-30-Math.random()*80,l:1,s:1+Math.random()*2.4})}
P=P.filter(p=>p.l>0);for(const p of P){p.x+=p.vx*.016;p.y+=p.vy*.016;p.vy+=45*.016;p.l-=.022;x.globalAlpha=Math.max(p.l,0);x.fillStyle=Math.random()<.5?'#ffd98a':'#9ee7ff';x.beginPath();x.arc(p.x,p.y,p.s,0,6.3);x.fill()}
if(t<5&&!ended)requestAnimationFrame(fr)}requestAnimationFrame(fr)})();
let ended=false;function endSplash(){if(ended)return;ended=true;$('#splash').classList.add('go');setTimeout(()=>$('#splash').remove(),900);me?start():show('login')}
setTimeout(endSplash,4800);$('#splash').onclick=endSplash;

/* effetti */
document.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;const r=b.getBoundingClientRect(),s=document.createElement('span'),d=Math.max(r.width,r.height)*2;s.className='rp';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),600)});
function burst(el){const r=el.getBoundingClientRect();for(let i=0;i<10;i++){const s=document.createElement('i'),a=i/10*6.28,d=30+Math.random()*30;s.className='bp';s.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;background:${COL[i%6]}`;document.body.appendChild(s);setTimeout(()=>s.remove(),700)}}

/* foto profilo */
const readPhoto=f=>new Promise(r=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d'),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);r(c.toDataURL('image/jpeg',.75))};im.src=URL.createObjectURL(f)});
function pick(inp,box){inp.onchange=async e=>{const f=e.target.files[0];if(!f)return;newPhoto=await readPhoto(f);box.innerHTML=`<img src="${newPhoto}"><input type="file" accept="image/*" hidden>`;pick(box.querySelector('input'),box)}}

/* login */
pick($('#lp input'),$('#lp'));
$('#lb').onclick=async()=>{const n=$('#ln').value.trim(),bx=$('#login .box');
if(!n){$('#ln').focus();bx.classList.remove('shake');void bx.offsetWidth;bx.classList.add('shake');return}
$('#lb').disabled=true;const r=await api('login',{user:me&&me.id,name:n,photo:newPhoto});$('#lb').disabled=false;
if(r.error=='full'){$('#le').textContent='😕 App al completo: massimo 15 utenti.';return}
if(!r.id){$('#le').textContent='Connessione assente, riprova.';return}
me={id:r.id,name:n,photo:newPhoto||''};saveMe();newPhoto=undefined;start()};
function start(){show('app');$('#lk').textContent=location.origin;renderHeader();poll();if(!started){started=true;setInterval(poll,1500);document.addEventListener('visibilitychange',poll)}}

/* profilo */
const renderHeader=()=>$('#meb').innerHTML=av(me.id,'sm');
$('#meb').onclick=()=>{const u=U(me.id);openSheet(`<h3>Il tuo profilo</h3><label class="pick" id="sp2">${u.p?`<img src="/api/photo?u=${me.id}&v=${u.v}">`:'<span>📷</span>'}<input type="file" accept="image/*" hidden></label><input id="sn2" value="${esc(me.name)}" maxlength="20"><button class="pri" id="ss">Salva</button>`);
newPhoto=undefined;pick($('#sp2 input'),$('#sp2'));
$('#ss').onclick=async()=>{const n=$('#sn2').value.trim();if(!n)return;const r=await api('login',{user:me.id,name:n,photo:newPhoto});if(r.id){me.name=n;if(newPhoto)me.photo=newPhoto;saveMe();closeSheet();sigU=sigP=sigH='';toast('Profilo aggiornato ✨');poll()}else toast('Errore, riprova')}};

/* polling */
async function poll(){if(busy||document.hidden||!me)return;busy=true;lastKick=Date.now();
try{const r=await fetch(`/api/state?user=${me.id}&after=${after}&t=${Date.now()-lastTyp<2500?1:0}`);
if(r.status==401){const x=await api('login',{name:me.name,photo:me.photo});if(x.id){me.id=x.id;saveMe();after=0;$('#ml').innerHTML='';first=true;sigP=sigU=sigH=''}else if(x.error=='full'){localStorage.removeItem('melas2');me=null;show('login');$('#le').textContent='App al completo (max 15).'}busy=false;return}
const d=await r.json();if(d.mid<after){after=0;$('#ml').innerHTML='';first=true}
S=d;$('#off').classList.remove('on');
if(d.chat.length){addMsgs(d.chat);after=d.chat[d.chat.length-1].i}
first=false;renderAll()}catch(e){$('#off').classList.add('on')}busy=false}
function renderAll(){const uk=Object.entries(S.users).map(([k,u])=>k+u.n+u.v).join('|');
if(uk+me.id!=sigH){sigH=uk+me.id;renderHeader()}
const sp=JSON.stringify(S.places)+uk;if(sp!=sigP){sigP=sp;renderPlaces()}
const su=JSON.stringify(S.users);if(su!=sigU){sigU=su;renderPeople()}
renderTyping();const on=Object.values(S.users).filter(u=>u.on).length;$('#b2').textContent=on;$('#b2').classList.toggle('on',on>0)}

/* proposte */
function renderPlaces(){const ps=[...S.places].sort((a,b)=>b.votes.length-a.votes.length||a.ts-b.ts);
$('#pl').innerHTML=ps.length?ps.map((p,i)=>{const top=i==0&&p.votes.length>1,nw=!shown.has(p.id);shown.add(p.id);const u=U(p.by);
return`<div class="glass card ${top?'top':''} ${nw?'new':''}"><div class="cb"><b>${top?'👑 ':''}${esc(p.title)}</b>${p.desc?`<p>${esc(p.desc)}</p>`:''}<div class="meta">${av(p.by,'xs')}<span>${esc(u?u.n:'?')}</span>${p.cost?`<span class="chip">💶 ${esc(p.cost)}</span>`:''}</div><div class="voters">${p.votes.slice(0,7).map(v=>av(v,'xxs')).join('')}</div></div>
<div class="act"><button class="vote ${p.votes.includes(me.id)?'on':''}" data-v="${p.id}">▲<em>${p.votes.length}</em></button>${p.by==me.id?`<button class="del" data-d="${p.id}">🗑</button>`:''}</div></div>`}).join(''):'<div class="empty">Nessuna proposta ancora.<br>Sii il primo! ✨</div>'}
$('#pl').onclick=async e=>{const v=e.target.closest('[data-v]'),d=e.target.closest('[data-d]');
if(v){const p=S.places.find(x=>x.id==v.dataset.v);if(!p)return;const i=p.votes.indexOf(me.id);if(i<0){p.votes.push(me.id);burst(v)}else p.votes.splice(i,1);navigator.vibrate&&navigator.vibrate(15);renderPlaces();await api('vote',{user:me.id,place:p.id});poll()}
if(d){if(!d.classList.contains('arm')){d.classList.add('arm');d.textContent='Elimina?';setTimeout(()=>{d.classList.remove('arm');d.textContent='🗑'},2500);return}
d.closest('.card').classList.add('out');await api('del',{user:me.id,place:d.dataset.d});setTimeout(()=>{sigP='';poll()},400)}};
$('#tg').onclick=()=>$('#fm').classList.toggle('open');
$('#pa').onclick=async()=>{const t=$('#pt').value.trim();if(!t){$('#pt').focus();return}await api('place',{user:me.id,title:t,desc:$('#pd').value,cost:$('#pc').value});['#pt','#pd','#pc'].forEach(s=>$(s).value='');$('#fm').classList.remove('open');toast('Proposta aggiunta 🎉');poll()};

/* chat */
function msgEl(m,anim){const mine=m.u==me.id,u=U(m.u)||{n:'?'},d=document.createElement('div');d.className='m '+(mine?'mi':'ot')+(anim?' pop':'');
d.innerHTML=(mine?'':av(m.u,'xs'))+`<div class="bb">${mine?'':`<small>${esc(u.n)}</small>`}<span>${esc(m.x)}</span><time>${new Date(m.ts*1000).toLocaleTimeString('it',{hour:'2-digit',minute:'2-digit'})}</time></div>`;return d}
function addMsgs(list){const cs=$('#cs'),near=cs.scrollHeight-cs.scrollTop-cs.clientHeight<140;let mine=false;
for(const m of list){$('#ml').appendChild(msgEl(m,!first));if(m.u==me.id)mine=true;else if(!first&&tab!=1)unread++}
badge();if(first||near||mine)requestAnimationFrame(()=>cs.scrollTo({top:cs.scrollHeight,behavior:first?'auto':'smooth'}))}
const badge=()=>{$('#b1').textContent=unread;$('#b1').classList.toggle('on',unread>0)};
function renderTyping(){const n=S.typing.map(id=>(S.users[id]||{}).n).filter(Boolean);$('#ty').classList.toggle('on',n.length>0);if(n.length)$('#tyn').textContent=n.length==1?n[0]+' sta scrivendo':n.length==2?n.join(' e ')+' stanno scrivendo':n.length+' persone stanno scrivendo'}
async function send(){const t=$('#ct').value.trim();if(!t)return;$('#ct').value='';lastTyp=0;await api('chat',{user:me.id,text:t});poll()}
$('#sb').onclick=send;$('#sb').addEventListener('pointerdown',e=>e.preventDefault());
$('#ct').onkeydown=e=>{if(e.key=='Enter')send()};
$('#ct').oninput=()=>{lastTyp=Date.now();if(Date.now()-lastKick>1200)poll()};

/* persone */
function renderPeople(){const us=Object.entries(S.users).sort((a,b)=>b[1].on-a[1].on||a[1].n.localeCompare(b[1].n));
$('#cnt').textContent=`${us.length}/${S.max} utenti · ${us.filter(x=>x[1].on).length} online`;
$('#ul').innerHTML=us.map(([id,u])=>{const nw=!shownU.has(id);shownU.add(id);return`<div class="glass row ${nw?'new':''}" data-u="${id}"><div class="aw">${av(id,'md')}${u.on?'<i class="dot"></i>':''}</div><div><b>${esc(u.n)}${id==me.id?' <em>(tu)</em>':''}</b><br><small class="${u.on?'on':''}">${u.on?'● online ora':'○ offline'}</small></div></div>`}).join('')}
$('#ul').onclick=e=>{const r=e.target.closest('[data-u]');if(!r)return;const id=r.dataset.u,u=U(id);openSheet(`<div class="cen">${av(id,'xl')}<h3>${esc(u.n)}</h3><small class="${u.on?'on':''}">${u.on?'● online ora':'○ offline'}</small></div>`)};

/* navigazione */
function go(n){tab=n;$$('.pane').forEach((p,i)=>p.classList.toggle('on',i==n));$$('nav button').forEach((b,i)=>b.classList.toggle('on',i==n));$('#ind').style.transform=`translateX(${n*100}%)`;if(n==1){unread=0;badge();requestAnimationFrame(()=>{$('#cs').scrollTop=1e7})}}
$$('nav button').forEach((b,i)=>b.onclick=()=>go(i));

/* scarica e condividi */
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
if(matchMedia('(display-mode: standalone)').matches)$$('.dl').forEach(b=>b.style.display='none');
$$('.dl').forEach(b=>b.onclick=()=>{if(S.apk&&!isIOS){location.href=S.apk;return}if(dp){dp.prompt();dp=null;return}
openSheet(`<h3>Installa MelasGo2</h3><p class="hp"><b>🤖 Android</b><br>Chrome → menu ⋮ → "Installa app"</p><p class="hp"><b>🍎 iPhone</b><br>Safari → Condividi ⬆ → "Aggiungi a Home"</p><p class="hp"><b>💻 PC</b><br>Chrome/Edge → icona Installa nella barra indirizzi</p>`)});
$$('.sh').forEach(b=>b.onclick=async()=>{const u=location.origin;try{if(navigator.share){await navigator.share({title:'MelasGo2',text:'Unisciti a MelasGo2! Decidiamo insieme dove andare sabato sera 🎉',url:u});return}}catch(e){if(e.name=='AbortError')return}
try{await navigator.clipboard.writeText(u);toast('Link copiato ✅')}catch(e){prompt('Copia il link',u)}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
